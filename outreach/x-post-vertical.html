<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>X Post Vertical</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1350px; background: #F6EFE2; }
    .card { width: 1080px; height: 1350px; display: flex; flex-direction: column; overflow: hidden; }
    .hero { width: 1080px; height: 660px; overflow: hidden; background: #7A4B2A; }
    .hero img { width: 1080px; height: 660px; object-fit: cover; object-position: center; display: block; }
    .content { flex: 1; padding: 58px 72px 64px; display: flex; flex-direction: column; justify-content: center; }
    .badge {
      display: inline-block; align-self: flex-start;
      background: #7A4B2A; color: #F6EFE2;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 24px; font-weight: 700; letter-spacing: 0;
      padding: 12px 22px; border-radius: 999px; margin-bottom: 28px;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 74px; line-height: 1.08; color: #4A2E1B;
      letter-spacing: 0;
    }
    .sub {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 32px; line-height: 1.45; color: #5C4033;
      margin-top: 26px; max-width: 900px; letter-spacing: 0;
    }
    .features { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 40px; }
    .feature {
      background: #FFFFFF; border: 2px solid #E8DDC8;
      border-radius: 12px; padding: 16px 22px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 23px; font-weight: 600; color: #5C4033;
    }
    .url {
      margin-top: 46px; font-family: Arial, Helvetica, sans-serif;
      font-size: 30px; font-weight: 700; color: #7A4B2A; letter-spacing: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="hero">
      <img src="../public/sourdough-baking-tools.png" alt="Sourdough baking tools" />
    </div>
    <div class="content">
      <span class="badge">Free Baking Tool</span>
      <h1>Sourdough Hydration Calculator</h1>
      <p class="sub">Enter your flour weight. Get exact water, salt and starter ratios instantly, plus a 50%-100% hydration chart.</p>
      <div class="features">
        <span class="feature">No signup</span>
        <span class="feature">6 recipe presets</span>
        <span class="feature">Mobile friendly</span>
        <span class="feature">Free forever</span>
      </div>
      <div class="url">sourdough-hydrationcalculator.com</div>
    </div>
  </div>
</body>
</html>
